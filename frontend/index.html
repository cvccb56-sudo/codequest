<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CodeQuest</title><style>body{margin:0;background:#090b12;color:#f5f7ff;font-family:system-ui}main{max-width:1050px;margin:auto;padding:25px}.card{background:#121625;border:1px solid #283047;border-radius:16px;padding:20px;margin:12px 0}input{padding:12px;margin:5px;background:#0b0e17;color:white;border:1px solid #34405c;border-radius:8px}button{padding:12px 16px;border:0;border-radius:8px;background:#765cff;color:white;font-weight:800;cursor:pointer}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.avatar{width:90px;height:90px;border-radius:50%;object-fit:cover;background:#252b42;display:block}.muted{color:#929bb5}@media(max-width:700px){.grid{grid-template-columns:1fr}}</style></head><body><main><h1>⚔️ CodeQuest</h1><p class="muted">Multiplayer Java → Spring Boot learning RPG</p><div id="auth" class="card"><h2>Join the party</h2><input id="u" placeholder="Username"><input id="p" type="password" placeholder="Password"><br><button onclick="register()">Create account</button> <button onclick="login()">Login</button><p id="msg"></p></div><div id="game" style="display:none"><div class="card"><div style="display:flex;gap:18px;align-items:center"><img id="photo" class="avatar"><div><h2 id="name"></h2><div id="title" class="muted"></div><b id="stats"></b></div></div><hr><input id="photoUrl" placeholder="Paste profile photo URL"><button onclick="saveProfile()">Save photo</button></div><div class="grid"><div class="card"><h3>⚔️ Daily Quest</h3><p>Complete a Java challenge.</p><button onclick="quest(50,30)">Complete +50 XP</button></div><div class="card"><h3>🐉 Mini Boss</h3><p>Limited reward.</p><button onclick="quest(150,100)">Defeat Boss</button></div><div class="card"><h3>📚 Course</h3><p>Java → DSA → SQL → Spring Boot</p><b>100 levels</b></div></div><div class="card"><h2>🏆 Global Leaderboard</h2><div id="board"></div></div></div></main><script>const API=location.hostname==="localhost"?"http://localhost:8080/api":"/api";let me=null;async function req(path,opt={}){let r=await fetch(API+path,{headers:{"Content-Type":"application/json"},...opt});let d=await r.json();if(!r.ok)throw Error(d.message||"Request failed");return d}function msg(x){document.getElementById("msg").textContent=x}async function register(){try{me=await req("/register",{method:"POST",body:JSON.stringify({username:u.value,password:p.value})});start()}catch(e){msg(e.message)}}async function login(){try{me=await req("/login",{method:"POST",body:JSON.stringify({username:u.value,password:p.value})});start()}catch(e){msg(e.message)}}function start(){auth.style.display="none";game.style.display="block";render();leader()}function render(){name.textContent=me.username+" — Level "+me.level;title.textContent="👑 "+me.title;stats.textContent=me.xp+" XP • 🪙 "+me.coins+" coins • "+me.dailyXp+"/1000 daily XP";photo.src=me.photoUrl||"https://placehold.co/180x180?text=⚔️"}async function saveProfile(){try{me=await req("/players/"+me.username+"/profile",{method:"POST",body:JSON.stringify({photoUrl:photoUrl.value})});render()}catch(e){alert(e.message)}}async function quest(xp,coins){try{me=await req("/players/"+me.username+"/quest",{method:"POST",body:JSON.stringify({xp,coins})});render();leader()}catch(e){alert(e.message)}}async function leader(){let l=await req("/leaderboard");board.innerHTML=l.map((x,i)=>"<p><b>"+(i+1)+". "+x.username+"</b> — Lv "+x.level+" — "+x.xp+" XP — 🪙 "+x.coins+"</p>").join("")}</script></body></html>
